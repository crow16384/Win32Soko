[package]
name = "sokoban-app"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sokoban-core = { path = "../core" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "HtmlButtonElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "CssStyleDeclaration",
  "DomRect",
  "DomTokenList",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "MouseEvent",
  "TouchEvent",
  "TouchList",
  "Touch",
  "PointerEvent",
  "Storage",
  "Location",
  "Navigator",
  "Performance",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "File",
  "FileList",
  "FileReader",
  "HtmlAnchorElement",
  "Node",
  "NodeList",
  "Text",
  "console",
  "Response",
  "Request",
]
