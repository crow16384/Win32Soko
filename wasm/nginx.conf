server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell HTML so clients pick up new asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Revalidate hashed assets (Trunk hashes do not always change when
    # only wasm-opt settings change, so long max-age caused stale WASM).
    location ~* \.(js|wasm|css)$ {
        etag on;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(png|ico|txt)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Do not gzip WASM — some browsers mishandle compressed module fetches.
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 256;
}
